<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 256" width="960" height="256" role="img" aria-labelledby="title desc">
<title id="title">Cyborg Undefined // Engineering profile</title>
<desc id="desc">Animated cybernetic terminal with QA, AI and Vertical Unit nodes connected by moving data packets.</desc>
<defs>
  <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0b111b"/><stop offset="1" stop-color="#111e2b"/></linearGradient>
  <linearGradient id="accent"><stop stop-color="#46e6c4"/><stop offset="1" stop-color="#77aaff"/></linearGradient>
  <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#527d93" stroke-opacity=".12"/></pattern>
  <radialGradient id="halo"><stop stop-color="#46e6c4" stop-opacity=".19"/><stop offset="1" stop-color="#46e6c4" stop-opacity="0"/></radialGradient>
</defs>
<style>
  .pulse{animation:pulse 3s ease-in-out infinite}
  .packet1{animation:packet1 3.8s linear infinite}
  .packet2{animation:packet2 4.8s linear infinite}
  .packet3{animation:packet3 4.2s linear infinite}
  .scan{animation:scan 6s linear infinite}
  .cursor{animation:blink 1.3s steps(1,end) infinite}
  @keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}
  @keyframes packet1{0%{transform:translateX(0);opacity:0}12%,85%{opacity:1}100%{transform:translateX(112px);opacity:0}}
  @keyframes packet2{0%{transform:translateY(0);opacity:0}12%,85%{opacity:1}100%{transform:translateY(64px);opacity:0}}
  @keyframes packet3{0%{transform:translateX(0);opacity:0}12%,85%{opacity:1}100%{transform:translateX(-112px);opacity:0}}
  @keyframes scan{0%{transform:translateY(0);opacity:0}15%,85%{opacity:.22}100%{transform:translateY(172px);opacity:0}}
  @keyframes blink{50%{opacity:0}}
  @media(prefers-reduced-motion:reduce){.pulse,.packet1,.packet2,.packet3,.scan,.cursor{animation:none}}
</style>
<rect x="1" y="1" width="958" height="254" rx="15" fill="url(#bg)" stroke="#355166"/>
<rect x="2" y="2" width="956" height="252" rx="14" fill="url(#grid)"/>
<ellipse cx="759" cy="125" rx="189" ry="125" fill="url(#halo)"/>
<path d="M20 52V20H52 M908 20H940V52 M20 204V236H52 M908 236H940V204" stroke="#46e6c4" stroke-width="2" fill="none" opacity=".8"/>
<path d="M40 43H565 M40 211H565" stroke="#294657"/>
<rect x="40" y="43" width="76" height="2" fill="url(#accent)"/>
<g font-family="ui-monospace, SFMono-Regular, Consolas, Liberation Mono, monospace">
  <text x="40" y="32" fill="#8da9ba" font-size="12" letter-spacing="2">PERSONAL ENGINEERING TERMINAL / 2026</text>
  <text x="40" y="93" fill="#e8f3fa" font-size="40" font-weight="700" letter-spacing=".8">CYBORG UNDEFINED</text>
  <text x="42" y="118" fill="#46e6c4" font-size="15" letter-spacing="2">ARTEM BONDARENKO</text>
  <text x="42" y="150" fill="#d0e0eb" font-size="17">MANUAL QA / API / INTEGRATIONS</text>
  <text x="42" y="174" fill="#9eb9d0" font-size="14">AI WORKFLOWS / AUTOMATION / R&amp;D</text>
  <circle cx="46" cy="194" r="4" fill="#46e6c4" class="pulse"/>
  <text x="58" y="198" fill="#46e6c4" font-size="12">BUILDING WITH VERTICAL UNIT</text>
  <rect x="270" y="187" width="7" height="13" fill="#46e6c4" class="cursor"/>
  <text x="42" y="231" fill="#8da9ba" font-size="11" letter-spacing="1">VERIFY THE SYSTEM. BUILD WHAT COMES NEXT.</text>
  <path d="M588 35V221" stroke="#355166" stroke-dasharray="3 5"/>
  <text x="614" y="35" fill="#8da9ba" font-size="11" letter-spacing="1.3">SYSTEM / SIGNAL FLOW</text>
  <g fill="none" stroke="#527d93" stroke-width="1.5">
    <path d="M672 79H784 M840 103V167 M784 191H672"/>
    <path d="M672 91V179 M684 79L828 191" stroke-dasharray="3 6" opacity=".45"/>
  </g>
  <g fill="#102330" stroke="#46e6c4">
    <rect x="614" y="55" width="116" height="48" rx="5"/>
    <rect x="782" y="55" width="116" height="48" rx="5"/>
    <rect x="782" y="167" width="116" height="48" rx="5"/>
    <rect x="614" y="167" width="116" height="48" rx="5" stroke="#5e7da8"/>
  </g>
  <g fill="#e8f3fa" font-size="14" font-weight="700" text-anchor="middle">
    <text x="672" y="76">QA</text><text x="840" y="76">AI</text><text x="840" y="188">VU</text><text x="672" y="188">R&amp;D</text>
  </g>
  <g fill="#99b7c8" font-size="10" text-anchor="middle">
    <text x="672" y="91">VERIFY</text><text x="840" y="91">AUTOMATE</text><text x="840" y="203">BUILD</text><text x="672" y="203">EXPLORE</text>
  </g>
  <g fill="#46e6c4">
    <circle cx="730" cy="79" r="3"/><circle cx="782" cy="79" r="3"/>
    <circle cx="840" cy="103" r="3"/><circle cx="840" cy="167" r="3"/>
    <circle cx="782" cy="191" r="3"/><circle cx="730" cy="191" r="3"/>
  </g>
  <g fill="#a3ffe9">
    <circle cx="735" cy="79" r="3.4" style="animation:short1 2.5s linear infinite"/>
    <circle cx="840" cy="103" r="3.4" class="packet2"/>
    <circle cx="777" cy="191" r="3.4" style="animation:short2 2.8s linear infinite"/>
  </g>
  <text x="614" y="235" fill="#8da9ba" font-size="10" letter-spacing="1">STATUS: CONTINUOUS ITERATION</text>
</g>
<style>
@keyframes short1{0%{transform:translateX(0);opacity:0}15%,85%{opacity:1}100%{transform:translateX(42px);opacity:0}}
@keyframes short2{0%{transform:translateX(0);opacity:0}15%,85%{opacity:1}100%{transform:translateX(-42px);opacity:0}}
@media(prefers-reduced-motion:reduce){circle[style]{animation:none!important}}
</style>
<path d="M606 48H910" stroke="#46e6c4" stroke-opacity=".1" class="scan"/>
</svg>